---
rocketpool_service_name: 'rocketpool'
rocketpool_service_path: '/data/{{ rocketpool_service_name }}'

rocketpool_user: 'rocketpool'
rocketpool_group: 'rocketpool'

rocketpool_metrics_addr: '0.0.0.0'
rocketpool_metrics_port: 9102

rocketpool_version: 'v1.23.0'
rocketpool_cli_sha256:    'e1cd355b4281f5286a3d72f718d67c9a44ddab50a2b33be566429278c8c2d212'
rocketpool_daemon_sha256: 'd9b73897634e68275f0ca704da7bed80693b033dd7d4f78a9aadc0ba002d3fdd'
rocketpool_treegen_sha256: 'a0bb0591f0abbbb62287bd7b89078c04f32c0ada7d9a32dcad674e3b82b16b70'

# Required for Eth1 sync
#rocketpool_eth1_exec_layer_rpc_url: ~
#rocketpool_eth1_exec_layer_ws_url: ~
#rocketpool_eth1_archive_url: ~
#rocketpool_eth2_rest_api_url: ~
# Fallback
#rocketpool_fallback_eth1_rpc_url: ~
#rocketpool_fallback_eth2_api_url: ~

rocketpool_graffiti: 'NimbusTeam' # Nimbus-compatible graffiti string
rocketpool_data_path:         '{{ rocketpool_service_path }}/smart-node'
rocketpool_records_path:      '{{ rocketpool_data_path }}/records'
rocketpool_validators_path:   '{{ rocketpool_data_path }}/validators'
rocketpool_node_service_name: '{{ rocketpool_service_name }}-smart-node'

rocketpool_watchtower_service_name: '{{ rocketpool_service_name }}-watchtower'
rocketpool_watchtower_metrics_port: 9104

# Unnecessary for oDAO nodes but CLI tool prompts for it
rocketpool_block_gas_limit: 60000000

# Generated randomly if not set
#rocketpool_password: ~
#rocketpool_wallet: ~
rocketpool_password_file: '{{ rocketpool_data_path }}/password'
rocketpool_wallet_file: '{{ rocketpool_data_path }}/wallet'
# Nimbus Eth2 Beacon Node
rocketpool_eth2_libp2p_port: 59001
rocketpool_eth2_discovery_port: 59001
rocketpool_eth2_metrics_port: 58008
rocketpool_eth2_rest_port: 55052

# Rewards tree generation dry-run timer
# https://github.com/rocket-pool/smartnode/tree/master/treegen
rocketpool_treegen_service_name: '{{ rocketpool_service_name }}-treegen'
rocketpool_treegen_output_path: '{{ rocketpool_service_path }}/treegen'
# Treegen has no fallback EC support and needs state for targeted block.
rocketpool_treegen_ec_url: '{{ rocketpool_eth1_archive_url }}'
rocketpool_treegen_bn_url: '{{ rocketpool_eth2_rest_api_url }}'
# Rewards intervals are 28 days, weekly runs ensure a dry-run before checkpoint.
rocketpool_treegen_timer_frequency: 'weekly'
# Generation without rolling records can take many hours.
rocketpool_treegen_timer_timeout_sec: 43200
rocketpool_treegen_nice_priority: 19
rocketpool_treegen_ionice_class: 'best-effort'
rocketpool_treegen_ionice_priority: 7
